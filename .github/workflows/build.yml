name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK derle
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Hatalari goster
        if: failure()
        run: |
          grep -E "error:|^e: |What went wrong|Could not|Duplicate class|AAPT|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: Dusme-Algilama-apk
          path: app/build/outputs/apk/debug/*.apk
