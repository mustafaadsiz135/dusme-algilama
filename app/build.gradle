plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.mustafaadsiz135.dusme'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.mustafaadsiz135.dusme'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Kutuphanelerin getirdigi eski/yeni Kotlin parcalarini ayni surume esitle (Duplicate class hatasi)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.guava:listenablefuture:1.0'

    // Yapay zeka: Google ML Kit poz (iskelet) tespiti - model uygulamanin icinde, internet gerekmez
    implementation 'com.google.mlkit:pose-detection:18.0.0-beta5'
}
